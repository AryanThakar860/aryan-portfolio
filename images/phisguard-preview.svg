<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0518"/>
      <stop offset="50%" stop-color="#140a2b"/>
      <stop offset="100%" stop-color="#05020c"/>
    </linearGradient>
    <linearGradient id="violetCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <radialGradient id="radarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg2)"/>
  <!-- Circular Radar / Threat Grid -->
  <circle cx="400" cy="250" r="180" fill="none" stroke="rgba(139, 92, 246, 0.2)" stroke-width="1.5"/>
  <circle cx="400" cy="250" r="120" fill="none" stroke="rgba(139, 92, 246, 0.3)" stroke-width="1.5"/>
  <circle cx="400" cy="250" r="60" fill="url(#radarGlow)"/>
  <line x1="400" y1="50" x2="400" y2="450" stroke="rgba(139, 92, 246, 0.15)" stroke-width="1"/>
  <line x1="200" y1="250" x2="600" y2="250" stroke="rgba(139, 92, 246, 0.15)" stroke-width="1"/>

  <!-- Threat Nodes -->
  <circle cx="470" cy="180" r="7" fill="#ff2a5f"/>
  <circle cx="470" cy="180" r="18" fill="none" stroke="#ff2a5f" stroke-opacity="0.4"/>
  <text x="485" y="184" font-family="'JetBrains Mono', monospace" font-size="10" fill="#ff2a5f">SUSPICIOUS_DOMAIN [89%]</text>

  <circle cx="340" cy="320" r="6" fill="#00f0ff"/>
  <text x="215" y="324" font-family="'JetBrains Mono', monospace" font-size="10" fill="#00f0ff">SAFE_INBOUND_MX</text>

  <circle cx="360" cy="160" r="8" fill="#f5b82e"/>
  <circle cx="360" cy="160" r="22" fill="none" stroke="#f5b82e" stroke-opacity="0.4"/>
  <text x="250" y="150" font-family="'JetBrains Mono', monospace" font-size="10" fill="#f5b82e">SPEAR_PHISH_SCORE: 72%</text>

  <!-- HUD Overlay Banner -->
  <rect x="60" y="380" width="680" height="70" rx="10" fill="rgba(20, 10, 43, 0.85)" stroke="rgba(139, 92, 246, 0.4)" stroke-width="1"/>
  <text x="90" y="410" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700" fill="#f8fafc">PHISGUARD / HACKIFY // THREAT TELEMETRY</text>
  <text x="90" y="432" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#a78bfa">ML-Powered Phishing Threat Detection, URL Entropy Analysis &amp; Incident Scorecard</text>
  <rect x="600" y="398" width="120" height="32" rx="6" fill="rgba(255, 42, 95, 0.2)" stroke="#ff2a5f"/>
  <text x="660" y="419" font-family="'JetBrains Mono', monospace" font-size="11" fill="#ff2a5f" text-anchor="middle">ACTIVE DEFENSE</text>
</svg>

